# Central configuration: every run reads from here so results are reproducible.

seed: 42

data:
  # Raw Kaggle file (not committed). Not committed -- see data/README.md.
  raw_path: data/loan.csv   # Kaggle "Lending Club Loan Data", 2007-2018Q4, 2.26M rows x 145 cols
  fallback_path: data/loan_data_2007_2014.csv
  term_months: 36            # 36-month loans only -> consistent default horizon
  # 2012 dropped: ~half its loans lack the bureau attributes (LC began capturing them mid-2012).
  # 2016+ dropped: many 36m loans still unresolved at the data cut-off (Dec 2018).
  issue_years: [2013, 2014, 2015]
  train_years: [2013, 2014]               # development sample
  oot_years: [2015]                       # out-of-time test sample

pd_model:
  fine_bins: 20              # quantile bins for fine classing
  min_bin_share: 0.05        # coarse bins must hold >= 5% of observations
  iv_min: 0.02               # drop features below this (useless predictors)
  iv_suspicious: 0.5         # flag features above this (possible leakage)
  vif_max: 5.0               # drop WoE features with VIF above this
  corr_max: 0.7              # ... or pairwise |corr| above this
  pvalue_max: 0.05

scorecard:
  pdo: 20                    # points to double the odds
  base_score: 600            # score at the base odds
  base_odds: 50              # 50:1 good:bad

validation:
  psi_bands: 10

el:
  pd_stress_multiplier: 1.5
  lgd_stress_add: 0.10
  mc_simulations: 10000

paths:
  reports: reports
  figures: reports/figures
